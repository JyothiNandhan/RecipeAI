on_http_request:
  - actions:
      - type: add-headers
        config:
          headers:
            ngrok-skip-browser-warning: "true"
on_http_response:
  - actions:
      - type: add-headers
        config:
          headers:
            Access-Control-Allow-Origin: "*"
            Access-Control-Allow-Methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
            Access-Control-Allow-Headers: "*"
            Access-Control-Max-Age: "3600"
